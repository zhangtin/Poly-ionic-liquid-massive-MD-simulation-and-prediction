[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdflow"
version = "0.1.0"
description = "MD Automation Platform V0.1 - GROMACS Script Builder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mdflow = "mdflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gromacs: integration tests that need a GROMACS installation (skipped otherwise)",
]
